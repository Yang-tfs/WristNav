name: Build WristNav IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: brew install ldid

      - name: Build IPA
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Verify IPA
        run: |
          ls -lh build/WristNav.ipa
          unzip -l build/WristNav.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: WristNav-IPA
          path: build/WristNav.ipa
          if-no-files-found: error
          retention-days: 30
